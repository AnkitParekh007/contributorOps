name: Hourly AI + Frontend OSS Radar

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-oss-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    name: Discover and prepare contribution workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_CONTRIBUTOROPS_TOKEN: ${{ secrets.GH_CONTRIBUTOROPS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_USERNAME: ${{ github.repository_owner }}
      AUTO_WORKSPACE_ENABLED: ${{ vars.CONTRIBUTOROPS_ALLOW_FORK_PREP == 'true' && 'true' || 'false' }}
      AUTO_CONTRIBUTE_ENABLED: ${{ vars.CONTRIBUTOROPS_ALLOW_UNATTENDED_PATCHES == 'true' && 'true' || 'false' }}
      HOURLY_RADAR_MIN_SCORE: '70'
      FORK_READY_TIMEOUT_MS: '60000'
      FORK_POLL_INTERVAL_MS: '1500'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Resolve GitHub credentials (fail closed for writes)
        env:
          CUSTOM_TOKEN: ${{ secrets.GH_CONTRIBUTOROPS_TOKEN }}
          READ_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$CUSTOM_TOKEN" ] && GH_TOKEN="$CUSTOM_TOKEN" gh api user >/dev/null 2>&1; then
            echo "ContributorOps custom credential is valid."
          else
            echo "::warning::Custom token missing or rejected (401). Using workflow token for read-only discovery. Rotate GH_CONTRIBUTOROPS_TOKEN before enabling writes."
            echo "GH_CONTRIBUTOROPS_TOKEN=" >> "$GITHUB_ENV"
            echo "AUTO_WORKSPACE_ENABLED=false" >> "$GITHUB_ENV"
            echo "AUTO_CONTRIBUTE_ENABLED=false" >> "$GITHUB_ENV"
          fi
          if ! GH_TOKEN="$READ_TOKEN" gh api "repos/${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::The workflow token cannot read this repository."
            exit 1
          fi

      - name: Restore daily radar state
        uses: actions/cache@v4
        with:
          path: data/hourly-radar-state.json
          key: hourly-radar-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hourly-radar-state-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run hourly radar
        run: npm run hourly

      - name: Publish radar summary
        if: always()
        run: |
          if [ -f data/hourly-radar-summary.md ]; then
            cat data/hourly-radar-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# ContributorOps Hourly Radar" >> "$GITHUB_STEP_SUMMARY"
            echo "No radar summary was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload radar packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-oss-radar-${{ github.run_id }}
          path: |
            data/hourly-radar-summary.md
            data/hourly-radar-state.json
            data/managed-forks.json
          if-no-files-found: ignore
          retention-days: 14
