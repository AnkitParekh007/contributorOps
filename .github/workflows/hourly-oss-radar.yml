name: Hourly AI + Frontend OSS Radar

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-oss-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    name: Discover and prepare contribution workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_CONTRIBUTOROPS_TOKEN: ${{ secrets.GH_CONTRIBUTOROPS_TOKEN }}
      GITHUB_USERNAME: ${{ github.repository_owner }}
      AUTO_WORKSPACE_ENABLED: 'true'
      AUTO_CONTRIBUTE_ENABLED: 'true'
      HOURLY_RADAR_MIN_SCORE: '70'
      FORK_READY_TIMEOUT_MS: '60000'
      FORK_POLL_INTERVAL_MS: '1500'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify ContributorOps token
        run: |
          if [ -z "$GH_CONTRIBUTOROPS_TOKEN" ]; then
            echo "GH_CONTRIBUTOROPS_TOKEN is not configured."
            exit 1
          fi

      - name: Restore daily radar state
        uses: actions/cache@v4
        with:
          path: data/hourly-radar-state.json
          key: hourly-radar-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hourly-radar-state-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run hourly radar
        run: npm run hourly

      - name: Publish radar summary
        if: always()
        run: |
          if [ -f data/hourly-radar-summary.md ]; then
            cat data/hourly-radar-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# ContributorOps Hourly Radar" >> "$GITHUB_STEP_SUMMARY"
            echo "No radar summary was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload radar packet
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hourly-oss-radar-${{ github.run_id }}
          path: |
            data/hourly-radar-summary.md
            data/hourly-radar-state.json
            data/managed-forks.json
          if-no-files-found: ignore
          retention-days: 14
