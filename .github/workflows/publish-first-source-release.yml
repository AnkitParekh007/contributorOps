name: Publish first validated source release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.repository == 'AnkitParekh007/contributorOps' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish v0.1.0 only if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists; leaving the release unchanged."
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.0" >/dev/null 2>&1; then
            echo "::error::Tag v0.1.0 already exists without a release. Inspect its target manually before publishing."
            exit 1
          fi
          test -f docs/releases/v0.1.0.md
          gh release create v0.1.0 \
            --repo "${{ github.repository }}" \
            --target "$RELEASE_SHA" \
            --title "ContributorOps v0.1.0 — public source release" \
            --notes-file docs/releases/v0.1.0.md
