# Temporary screenshot capture. Hides the sticky navbar only during export, not in the actual site.
name: One-shot clean footer screenshots
on:
  push:
    branches: [design/footer-conversion-redesign-20261122]
    paths: [.github/workflows/refresh-footer-screenshots-once.yml]
permissions:
  contents: write
jobs:
  export:
    if: github.repository == 'AnkitParekh007/contributorOps'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site and start preview
        run: |
          npm ci
          npm run site:build
          (cd apps/site && npx --no-install vite preview --host 127.0.0.1 --port 4174) >/tmp/footer.log 2>&1 &
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:4174/contributorOps/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:4174/contributorOps/ >/dev/null || { cat /tmp/footer.log; exit 1; }
      - name: Regenerate unobstructed visual QA assets
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0' 'Pillow>=10,<13'
          python - <<'PY'
          import os
          from PIL import Image
          from playwright.sync_api import sync_playwright
          chrome=next((x for x in ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'] if os.path.isfile(x)),None)
          assert chrome
          with sync_playwright() as pw:
              browser=pw.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              for label,width,height,theme in [('desktop-light',1440,900,'light'),('mobile-dark',390,844,'dark')]:
                  page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1,reduced_motion='reduce')
                  page.add_init_script(f"localStorage.setItem('contributorops_theme','{theme}')")
                  page.goto('http://127.0.0.1:4174/contributorOps/#/',wait_until='networkidle')
                  footer=page.locator('.footer-v2')
                  footer.scroll_into_view_if_needed()
                  assert footer.locator('#footer-v2-heading').is_visible()
                  assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1'),label
                  # The sticky header can be composited halfway through a tall element screenshot.
                  # Hide it ONLY for the QA export; real visitors retain the sticky navigation.
                  page.locator('.navbar').evaluate("(node)=>node.style.visibility='hidden'")
                  path=f'docs/assets/footer-redesign-{label}.png'
                  footer.screenshot(path=path,animations='disabled')
                  with Image.open(path) as img:
                      assert img.width>300 and img.height>450,img.size
                  print('Verified clean screenshot:',path,flush=True)
                  page.close()
              browser.close()
          PY
      - name: Commit corrected screenshots and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/refresh-footer-screenshots-once.yml
          git add docs/assets/footer-redesign-desktop-light.png docs/assets/footer-redesign-mobile-dark.png .github/workflows/refresh-footer-screenshots-once.yml
          git diff --cached --check
          git commit -m 'docs(visual): save unobstructed responsive footer proof'
          git push origin HEAD:design/footer-conversion-redesign-20261122
