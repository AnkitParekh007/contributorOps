name: Daily ContributorOps

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: read

jobs:
  daily-plan:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_CONTRIBUTOROPS_TOKEN: ${{ secrets.GH_CONTRIBUTOROPS_TOKEN }}
      AUTO_CONTRIBUTE_ENABLED: "false"
      AUTO_WORKSPACE_ENABLED: "false"
      CREATE_DAILY_ISSUE: ${{ vars.CREATE_DAILY_ISSUE || 'false' }}
      CONTRIBUTOROPS_OWNER: AnkitParekh007
      CONTRIBUTOROPS_REPO: contributorOps
    steps:
      # SAFETY INVARIANT: Daily planning never writes to third-party repositories.
      # A planning issue in this repository is an explicit opt-in with a valid custom PAT.
      # Interactive external writes and the standing exact-patch queue are separately authorized.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve credential and disable unapproved writes on fallback
        env:
          CUSTOM_TOKEN: ${{ secrets.GH_CONTRIBUTOROPS_TOKEN }}
        run: |
          if [ -n "$CUSTOM_TOKEN" ] && GH_TOKEN="$CUSTOM_TOKEN" gh api user >/dev/null 2>&1; then
            echo "Validated daily-plan custom token."
          else
            echo "::warning::Missing/rejected custom PAT: switching to built-in read-only GitHub token; suppressing daily issue creation."
            echo "GH_CONTRIBUTOROPS_TOKEN=" >> "$GITHUB_ENV"
            echo "CREATE_DAILY_ISSUE=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate daily plan
        run: npm run daily

      - name: Upload daily plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: contributorops-daily-plan
          path: data/daily-plan.json
