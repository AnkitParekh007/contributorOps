# Temporary read-only integration test; removed from the PR after the investigation.
name: One-shot GitHub radar discovery regression test
on:
  push:
    branches:
      - fix/radar-discovery-coverage-20261122
    paths:
      - .github/workflows/radar-discovery-test-once.yml
      - apps/api/src/github.ts

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_CONTRIBUTOROPS_TOKEN: ''
      GITHUB_USERNAME: ${{ github.repository_owner }}
      AUTO_WORKSPACE_ENABLED: 'false'
      AUTO_CONTRIBUTE_ENABLED: 'false'
      CREATE_DAILY_ISSUE: 'false'
      STORAGE_MODE: demo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check live issue discovery reaches at least one candidate
        run: |
          npm run hourly | tee /tmp/contributorops-radar.log
          if grep -Fq '"selected": []' /tmp/contributorops-radar.log && grep -Fq '"rejectedCount": 0' /tmp/contributorops-radar.log; then
            echo "::error::GitHub radar discovery returned no candidates and evaluated nothing. See repo/issue scan diagnostics."
            exit 1
          fi
          test -s data/hourly-radar-summary.md
          grep -Fq 'No issue comments were posted.' data/hourly-radar-summary.md
          grep -Fq 'No upstream pull requests were opened.' data/hourly-radar-summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-discovery-regression-${{ github.run_id }}
          path: data/hourly-radar-summary.md
          if-no-files-found: warn
