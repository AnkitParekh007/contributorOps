# Temporary branch-scoped visual QA, self-deletes after committing screenshots.
name: Capture contribution proof section desktop and mobile
# Includes regression assertion for global viewport overflow, hero and footer.
on:
  push:
    branches: [design/contribution-to-proof-ux-20261122]
    paths: [.github/workflows/capture-proof-ux-once.yml]
permissions:
  contents: write
jobs:
  capture:
    if: github.repository == 'AnkitParekh007/contributorOps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build real public site
        run: |
          npm ci
          npm run site:build
          (cd apps/site && npx --no-install vite preview --host 127.0.0.1 --port 4174) >/tmp/contributorops-site.log 2>&1 &
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:4174/contributorOps/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:4174/contributorOps/ >/dev/null || { cat /tmp/contributorops-site.log; exit 1; }
      - name: Screenshot actual proof section at two viewports
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0' 'Pillow>=10,<13'
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          from playwright.sync_api import sync_playwright
          chrome = next((p for p in ['/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium'] if os.path.isfile(p)), None)
          assert chrome, 'Chrome executable not found'
          Path('docs/assets').mkdir(parents=True, exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch(executable_path=chrome, headless=True, args=['--no-sandbox', '--disable-dev-shm-usage'])
              for label, width, height in [('desktop', 1440, 960), ('mobile', 390, 844)]:
                  page = browser.new_page(viewport={'width':width, 'height':height}, device_scale_factor=1, reduced_motion='reduce')
                  page.goto('http://127.0.0.1:4174/contributorOps/#/', wait_until='networkidle')
                  section = page.locator('#problem')
                  section.scroll_into_view_if_needed()
                  page.wait_for_timeout(350)
                  assert section.is_visible(), 'Proof section is hidden'
                  assert section.locator('.proof-artifact-link').count() == 1
                  offenders = page.evaluate("""() => Array.from(document.querySelectorAll('*')).filter(el => el.getBoundingClientRect().right > window.innerWidth + 2 && getComputedStyle(el).position !== 'fixed').slice(0,12).map(el => ({tag: el.tagName, cls: String(el.className).slice(0,100), right: Math.round(el.getBoundingClientRect().right)}))""")
                  print('Overflow diagnostics', label, offenders)
                  assert not offenders, f'Horizontal overflow on {label}: {offenders}'
                  output = f'docs/assets/contribution-proof-{label}.png'
                  section.screenshot(path=output, animations='disabled')
                  with Image.open(output) as im:
                      assert im.width >= min(width - 100, 280), im.size
                      assert im.height >= 350, im.size
                  print(label, output, section.bounding_box())
                  page.close()
              browser.close()
          PY
      - name: Commit visual QA snapshots and self-remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/capture-proof-ux-once.yml
          git add docs/assets/contribution-proof-desktop.png docs/assets/contribution-proof-mobile.png .github/workflows/capture-proof-ux-once.yml
          git diff --cached --check
          git commit -m 'docs(visual): record verified desktop and mobile proof UX renders'
          git push origin HEAD:design/contribution-to-proof-ux-20261122
