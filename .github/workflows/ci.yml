name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

  trust-boundary-tests:
    name: Approval Trust Boundary Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Verify approval-gated external writes
        run: npm run test:api

  runtime-dependency-audit:
    name: Runtime Dependency Audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Fail on high or critical runtime vulnerabilities
        run: npm run security:audit:runtime

  full-dependency-audit-report:
    name: Full Dependency Audit Report
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Report all dependency findings without weakening the runtime gate
        run: npm audit --audit-level=low || true

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build API
        run: npm run build --workspace @contributorops/api

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build Web
        run: npm run build --workspace @contributorops/web

  build-site:
    name: Build Site + Quality
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build Site
        run: npm run site:build
      - name: Verify routes, metadata, accessibility hygiene, and Pages paths
        run: node scripts/site-quality.mjs
      - name: Verify campaign attribution and anti-gaming policy
        run: npm run growth:quality

  lighthouse:
    name: Lighthouse Quality Budgets
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run reproducible Lighthouse budgets
        run: npm run site:lighthouse

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript check (API)
        run: cd apps/api && npx tsc --noEmit
      - name: TypeScript check (Web)
        run: cd apps/web && npx tsc --noEmit
      - name: TypeScript check (Site)
        run: cd apps/site && npx tsc --noEmit

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for common secret patterns
        run: |
          if grep -rn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
            -E "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16})" \
            --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "Potential secrets found — review before merging"
            exit 1
          fi
          echo "No obvious secret patterns found"
