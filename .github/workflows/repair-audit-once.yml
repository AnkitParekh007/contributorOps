# Temporary, branch-scoped migration. This workflow removes itself on success.
name: One-shot runtime dependency repair
on:
  push:
    branches:
      - fix/trust-onboarding-and-growth-20261122
    paths:
      - .github/workflows/repair-audit-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'AnkitParekh007/contributorOps' && github.ref == 'refs/heads/fix/trust-onboarding-and-growth-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Remediate only compatible runtime advisories
        run: |
          npm ci
          npm audit fix --omit=dev
          npm ci
          npm run security:audit:runtime
      - name: Verify the dependency changes
        run: |
          npm run test:api
          npm run typecheck
          npm run build:all
      - name: Commit verified lockfile and self-remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/repair-audit-once.yml
          git add package-lock.json package.json apps/api/package.json apps/site/package.json apps/web/package.json .github/workflows/repair-audit-once.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to record"; exit 1; }
          git commit -m "chore(security): apply compatible npm audit patches and remove one-shot workflow"
          git push origin HEAD:fix/trust-onboarding-and-growth-20261122
