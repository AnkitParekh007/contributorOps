name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Detect GitHub Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency Graph is disabled. Enable it in repository security settings to activate Dependency Review as a hard PR gate."
          fi
      - name: Reject newly introduced high-severity vulnerabilities
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Install Node.js for high-severity fallback audit
        if: steps.dependency-graph.outputs.enabled != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Reject high-severity vulnerabilities while Dependency Graph is disabled
        if: steps.dependency-graph.outputs.enabled != 'true'
        run: |
          npm ci
          npm audit --audit-level=high
          echo "::notice::Full dependency npm audit passed. GitHub's change-scoped Dependency Review remains unavailable until Dependency Graph is enabled."
      - name: Report owner setting still required
        if: steps.dependency-graph.outputs.enabled != 'true'
        run: echo "::warning::Enable GitHub Dependency Graph in repository security settings to activate change-scoped Dependency Review. Fallback npm audit is enforcing a high/critical vulnerability gate meanwhile."
