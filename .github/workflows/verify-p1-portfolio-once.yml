name: One-shot P1 hosted portfolio acceptance
on:
  push:
    branches: [fix/p1-hosted-portfolio-contract-20261123]
    paths: [.github/workflows/verify-p1-portfolio-once.yml]
permissions:
  contents: write
jobs:
  test-portfolio:
    if: github.repository == 'AnkitParekh007/contributorOps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: API trust-boundary and hosted portfolio tests
        run: npm run test:api
      - name: Build API and all frontend apps
        run: npm run build:all
      - name: Typecheck API, web and site
        run: npm run typecheck
      - name: High-severity runtime audit
        run: npm run security:audit:runtime
      - name: Remove the one-shot QA workflow after success
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/verify-p1-portfolio-once.yml
          git add .github/workflows/verify-p1-portfolio-once.yml
          git commit -m "test(qa): archive passing P1 portfolio acceptance"
          git push origin HEAD:fix/p1-hosted-portfolio-contract-20261123
