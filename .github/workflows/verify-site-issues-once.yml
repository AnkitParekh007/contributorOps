name: One-shot UI accessibility and state regression check
on:
  push:
    branches: [fix/issues-5-8-11-20261122]
    paths: [.github/workflows/verify-site-issues-once.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'AnkitParekh007/contributorOps'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public site
        run: |
          npm ci
          npm run site:build
          (cd apps/site && npx --no-install vite preview --host 127.0.0.1 --port 4174) > /tmp/site-preview.log 2>&1 &
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:4174/contributorOps/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:4174/contributorOps/ >/dev/null || { cat /tmp/site-preview.log; exit 1; }
      - name: Exercise real clipboard feedback and GitHub API states
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          chrome = next((p for p in ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'] if os.path.exists(p)), None)
          assert chrome, 'No Chrome executable on runner'
          root = 'http://127.0.0.1:4174/contributorOps/'
          with sync_playwright() as pw:
              browser = pw.chromium.launch(executable_path=chrome, headless=True, args=['--no-sandbox','--disable-dev-shm-usage'])
              for label,width,height,theme in [('desktop-dark',1440,900,'dark'),('mobile-light',390,844,'light')]:
                  context = browser.new_context(viewport={'width':width,'height':height}, reduced_motion='reduce')
                  page = context.new_page()
                  page.add_init_script("""Object.defineProperty(navigator, 'clipboard', {
                    configurable: true,
                    value: {writeText: async (value) => { window.__copiedText = value; }}
                  });""")
                  page.goto(root+'#/share',wait_until='networkidle')
                  page.evaluate("(theme)=>document.documentElement.setAttribute('data-theme',theme)",theme)
                  button=page.get_by_role('button',name='Copy message for Developer / contributor')
                  button.focus()
                  button.press('Enter')
                  page.locator('.distribution-page [role="status"]').get_by_text('Copied message for developer to clipboard.',exact=True).wait_for()
                  assert button.evaluate('(el)=>el===document.activeElement'), 'Copy stole keyboard focus'
                  assert 'ContributorOps' in page.evaluate('window.__copiedText')
                  assert page.evaluate('document.documentElement.scrollWidth <= innerWidth + 1'), f'{label}: page overflow'
                  page.close()

                  denied=context.new_page()
                  denied.add_init_script("""Object.defineProperty(navigator,'clipboard',{
                    configurable:true, value:{writeText:async()=>{throw Error('denied')}}
                  });""")
                  denied.goto(root+'#/share',wait_until='networkidle')
                  btn=denied.get_by_role('button',name='Copy message for Developer / contributor')
                  btn.focus()
                  btn.press('Enter')
                  denied.locator('.distribution-page [role="status"]').get_by_text('Couldn\'t copy the developer message.',exact=False).wait_for()
                  assert denied.locator('.share-feedback.is-error').first.is_visible(), 'Error feedback not visible'
                  assert btn.evaluate('(el)=>el===document.activeElement'), 'Failure stole focus'
                  denied.close()
                  context.close()
                  print('PASS Share Hub clipboard success/error, focus, and responsive theme:', label)

              context=browser.new_context(viewport={'width':390,'height':844},reduced_motion='reduce')
              page=context.new_page()
              page.route('https://api.github.com/repos/AnkitParekh007/contributorOps**',lambda route: route.fulfill(status=503,body='service unavailable'))
              page.goto(root+'#/adoption',wait_until='networkidle')
              page.get_by_role('alert').get_by_text('Live GitHub data is unavailable').wait_for()
              assert page.locator('.adoption-metric-grid').count() == 0, 'Unverified metrics rendered as zero'
              assert page.get_by_role('button',name='Retry GitHub request').is_visible()
              assert page.evaluate('document.documentElement.scrollWidth <= innerWidth + 1'), 'Adoption page overflow'
              page.close()
              context.close()
              print('PASS honest failed-GitHub state, retry and no fake metrics')
              browser.close()
          PY
      - name: Self-remove temporary verification workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/verify-site-issues-once.yml
          git add .github/workflows/verify-site-issues-once.yml
          git commit -m 'test: remove completed site accessibility smoke workflow'
          git push origin HEAD:fix/issues-5-8-11-20261122
