# Temporary branch-scoped export; removes itself after a validated PNG is committed.
name: One-shot GitHub social preview export

on:
  push:
    branches:
      - fix/trust-onboarding-and-growth-20261122
    paths:
      - .github/workflows/export-social-preview-once.yml

permissions:
  contents: write

jobs:
  export:
    if: github.repository == 'AnkitParekh007/contributorOps' && github.ref == 'refs/heads/fix/trust-onboarding-and-growth-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export 1200x630 PNG from existing source artwork
        run: |
          python -m pip install --disable-pip-version-check 'CairoSVG==2.7.1' 'Pillow>=10,<13'
          python - <<'PY'
          import cairosvg
          from PIL import Image
          source = "apps/site/public/og-image.svg"
          destination = "apps/site/public/og-image.png"
          cairosvg.svg2png(url=source, write_to=destination, output_width=1200, output_height=630)
          with Image.open(destination) as im:
              assert im.size == (1200, 630), im.size
              assert im.format == "PNG", im.format
          print("Validated 1200x630 PNG:", destination)
          PY
      - name: Commit generated artwork and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/export-social-preview-once.yml
          git add apps/site/public/og-image.png .github/workflows/export-social-preview-once.yml
          git diff --cached --check
          git commit -m "assets: publish real 1200x630 ContributorOps social preview PNG"
          git push origin HEAD:fix/trust-onboarding-and-growth-20261122
