<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="ContributorOps is an open-source contribution intelligence platform that helps developers discover better OSS issues, prepare stronger pull requests, and turn real contributions into recruiter-readable proof of work."
		/>
		<meta
			name="keywords"
			content="open source contributions, developer portfolio, GitHub portfolio, proof of work, OSS contribution tool, pull request quality, GitHub resume, developer career, recruiter engineering signal, TypeScript, React, Node.js"
		/>
		<meta name="author" content="ContributorOps" />
		<meta name="robots" content="index, follow, max-image-preview:large" />
		<meta name="theme-color" content="#07111d" />
		<meta name="application-name" content="ContributorOps" />

		<meta property="og:title" content="ContributorOps — Open-Source Contributions Into Career Proof" />
		<meta
			property="og:description"
			content="Discover better OSS work, prepare higher-quality PRs, and package real contributions into verifiable engineering proof for portfolios, interviews, and recruiters."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://ankitparekh007.github.io/contributorOps/" />
		<meta property="og:image" content="https://ankitparekh007.github.io/contributorOps/og-image.svg" />
		<meta property="og:image:alt" content="ContributorOps — open-source contribution intelligence and career proof" />
		<meta property="og:site_name" content="ContributorOps" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="ContributorOps — Open-Source Contributions Into Career Proof" />
		<meta
			name="twitter:description"
			content="Open-source contribution intelligence for better issue discovery, stronger PRs, and recruiter-readable proof of work."
		/>
		<meta name="twitter:image" content="https://ankitparekh007.github.io/contributorOps/og-image.svg" />

		<link rel="canonical" href="https://ankitparekh007.github.io/contributorOps/" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/contributorOps/contributorops-icon-light.svg"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/contributorOps/contributorops-icon-dark.svg"
			media="(prefers-color-scheme: dark)"
		/>
		<link rel="apple-touch-icon" href="/contributorOps/contributorops-icon-light.svg" />
		<link rel="manifest" href="/contributorOps/site.webmanifest" />

		<title>ContributorOps — Open-Source Contribution Intelligence & Career Proof</title>

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareSourceCode",
				"name": "ContributorOps",
				"description": "Open-source contribution intelligence platform that helps developers discover better OSS work, prepare stronger pull requests, and turn real contributions into recruiter-readable proof of work.",
				"codeRepository": "https://github.com/AnkitParekh007/contributorOps",
				"url": "https://ankitparekh007.github.io/contributorOps/",
				"license": "https://opensource.org/license/bsd-3-clause",
				"programmingLanguage": ["TypeScript", "JavaScript"],
				"runtimePlatform": "Node.js",
				"author": {
					"@type": "Person",
					"name": "Ankit Parekh",
					"url": "https://github.com/AnkitParekh007"
				}
			}
		</script>

		<script>
			(function () {
				try {
					var stored = localStorage.getItem("contributorops_theme");
					var theme =
						stored === "light" || stored === "dark"
							? stored
							: window.matchMedia("(prefers-color-scheme: light)").matches
								? "light"
								: "dark";
					document.documentElement.dataset.theme = theme;
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
