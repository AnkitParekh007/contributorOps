<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ContributorOps — Turn OSS work into career proof</title>
  <desc id="desc">Human-approved open-source contribution intelligence with public architecture and recruiter-readable evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070914"/>
      <stop offset="55%" stop-color="#101226"/>
      <stop offset="100%" stop-color="#081628"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="16%" r="38%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g opacity="0.12" stroke="#ffffff">
    <path d="M0 90H1200M0 150H1200M0 210H1200M0 270H1200M0 330H1200M0 390H1200M0 450H1200M0 510H1200M0 570H1200"/>
    <path d="M60 0V630M120 0V630M180 0V630M240 0V630M300 0V630M360 0V630M420 0V630M480 0V630M540 0V630M600 0V630M660 0V630M720 0V630M780 0V630M840 0V630M900 0V630M960 0V630M1020 0V630M1080 0V630M1140 0V630"/>
  </g>

  <rect x="64" y="60" width="38" height="38" rx="10" fill="#8b5cf6"/>
  <circle cx="83" cy="79" r="7" fill="#22d3ee"/>
  <text x="118" y="88" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="750" fill="#f7f7ff">ContributorOps</text>

  <rect x="64" y="136" width="326" height="42" rx="21" fill="#8b5cf6" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.42"/>
  <text x="86" y="163" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#cfc7ff" letter-spacing="1.2">OPEN-SOURCE ENGINEERING</text>

  <text x="64" y="272" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="66" font-weight="800" fill="#f7f7ff" letter-spacing="-2.4">Turn OSS work into</text>
  <text x="64" y="350" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="66" font-weight="800" fill="url(#brand)" letter-spacing="-2.4">career proof.</text>
  <text x="68" y="412" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" fill="#b7bdd8">Human-approved contribution intelligence for better issues,</text>
  <text x="68" y="448" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" fill="#b7bdd8">stronger PRs, public architecture, and recruiter-readable evidence.</text>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#e1e5f5">
    <rect x="68" y="492" width="176" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/><text x="88" y="519">React + TypeScript</text>
    <rect x="256" y="492" width="156" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/><text x="278" y="519">Node + Express</text>
    <rect x="424" y="492" width="98" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/><text x="448" y="519">Octokit</text>
    <rect x="534" y="492" width="174" height="42" rx="21" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.28"/><text x="554" y="519" fill="#c9f7e7">Human-approved</text>
  </g>

  <g transform="translate(844 177)">
    <rect width="292" height="310" rx="28" fill="#090d1d" fill-opacity="0.9" stroke="#8b5cf6" stroke-opacity="0.34"/>
    <text x="28" y="48" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="750" fill="#f7f7ff">Contribution flow</text>
    <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#d4d8ea">
      <circle cx="48" cy="92" r="8" fill="#8b5cf6"/><text x="70" y="98">Discover</text>
      <path d="M48 101V125" stroke="#65708d" stroke-width="2"/>
      <circle cx="48" cy="140" r="8" fill="#8b5cf6"/><text x="70" y="146">Prepare</text>
      <path d="M48 149V173" stroke="#65708d" stroke-width="2"/>
      <circle cx="48" cy="188" r="8" fill="#8b5cf6"/><text x="70" y="194">Validate</text>
      <path d="M48 197V217" stroke="#65708d" stroke-width="2"/>
      <rect x="26" y="218" width="224" height="42" rx="13" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.38"/>
      <circle cx="48" cy="239" r="8" fill="#34d399"/><text x="70" y="245" fill="#caf5e5">Human approval</text>
      <path d="M48 260V278" stroke="#65708d" stroke-width="2"/>
      <circle cx="48" cy="290" r="8" fill="#22d3ee"/><text x="70" y="296">External write</text>
    </g>
  </g>

  <text x="68" y="590" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#8f99ba">github.com/AnkitParekh007/contributorOps</text>
